<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>หน้าเว็บของฉัน</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Sarabun", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .card {
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 400px;
      text-align: center;
    }

    .card h1 { color: #764ba2; margin-bottom: 12px; }
    .card p  { line-height: 1.6; margin-bottom: 20px; }

    .btn {
      background: #667eea;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover { background: #5a67d8; transform: translateY(-2px); }
    .btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">สวัสดีครับ</h1>
    <p id="message">นี่คือตัวอย่างการตกแต่งหน้าเว็บด้วย CSS</p>
    <button class="btn" id="myBtn">กดตรงนี้</button>
  </div>

  <script>
    const btn = document.getElementById("myBtn");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    let count = 0;

    btn.addEventListener("click", function () {
      count++;
      title.textContent = "คุณกดแล้ว!";
      message.textContent = "กดไปแล้ว " + count + " ครั้ง";
    });
  </script>
</body>
</html>
